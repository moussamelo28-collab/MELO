<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MELO Gym</title>
<style>
:root{--bg:#0b0b10;--card:#16161f;--line:#262633;--tx:#f2f2f7;--mu:#8a8aa0;--a:#ff4d6d;--b:#ff9e3d;--g:#3ddc97}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 20% -10%,#2a1020,transparent 50%),var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,sans-serif;min-height:100vh;padding:20px 16px 100px;max-width:560px;margin:auto}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px}h1 span,.grad{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mu);margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
input,select{background:#0f0f16;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font:inherit;width:100%;min-width:0}
button{border:0;border-radius:12px;padding:12px 16px;font:600 15px system-ui;color:#fff;background:var(--line);cursor:pointer;transition:transform .1s}
button:active{transform:scale(.96)}.pri{background:linear-gradient(90deg,var(--a),var(--b))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat b{display:block;font-size:22px}.stat small{color:var(--mu);font-size:12px}
.set{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.pr{color:var(--g);font-size:12px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:#0f0f16;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:9px;transition:width .6s}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#0b0b10e6;backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{background:none;color:var(--mu);flex:1;max-width:130px}nav button.on{color:var(--tx);background:var(--card)}
#timer{position:fixed;top:16px;right:16px;background:var(--card);border:1px solid var(--a);border-radius:99px;padding:8px 16px;font:700 18px system-ui;display:none;box-shadow:0 0 30px #ff4d6d55}
canvas{width:100%;height:180px}.x{background:none;color:var(--mu);padding:4px 8px}
</style>
</head>
<body>
<div id="timer"></div>
<h1>MELO <span>Gym</span></h1>
<p class="mu" id="hello"></p>
<main id="app"></main>
<nav>
<button data-v="train" class="on">🏋️ Séance</button>
<button data-v="goals">🎯 Objectifs</button>
<button data-v="prog">📈 Progrès</button>
</nav>
<script>
const $=s=>document.querySelector(s),D=JSON.parse(localStorage.melo||'{"log":[],"goals":{}}'),save=()=>localStorage.melo=JSON.stringify(D);
const EX=['Développé couché','Squat','Soulevé de terre','Développé militaire','Tractions','Rowing barre','Curl biceps','Dips','Presse à cuisses','Hip thrust'];
const today=()=>new Date().toISOString().slice(0,10),e1rm=(w,r)=>w*(1+r/30),best=ex=>Math.max(0,...D.log.filter(s=>s.ex==ex).map(s=>e1rm(s.w,s.r)));
let view='train',tInt;
$('#hello').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));render()});
function rest(s){clearInterval(tInt);const t=$('#timer');let r=s;t.style.display='block';const f=()=>{t.textContent=`⏱ ${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}`;if(r--<=0){clearInterval(tInt);t.style.display='none';navigator.vibrate?.([300,100,300])}};f();tInt=setInterval(f,1000);t.onclick=()=>{clearInterval(tInt);t.style.display='none'}}
function add(){const ex=$('#ex').value,w=+$('#w').value,r=+$('#r').value;if(!w||!r)return;const pr=e1rm(w,r)>best(ex);D.log.push({d:today(),ex,w,r,pr});save();rest(+$('#rest').value);render()}
function del(i){D.log.splice(i,1);save();render()}
function setGoal(){const ex=$('#gex').value,v=+$('#gv').value;if(v){D.goals[ex]=v;save();render()}}
const opts=sel=>EX.map(e=>`<option ${e==sel?'selected':''}>${e}</option>`).join('');
function streak(){const ds=new Set(D.log.map(s=>s.d));let n=0,d=new Date();if(!ds.has(today()))d.setDate(d.getDate()-1);while(ds.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function render(){const A=$('#app'),last=D.log.at(-1)?.ex;
if(view=='train'){const td=D.log.map((s,i)=>({...s,i})).filter(s=>s.d==today()),vol=td.reduce((a,s)=>a+s.w*s.r,0);
A.innerHTML=`<div class="stats" style="margin-top:16px"><div class="card stat"><b class="grad">${td.length}</b><small>Séries</small></div><div class="card stat"><b>${vol>999?(vol/1000).toFixed(1)+'t':vol+'kg'}</b><small>Volume</small></div><div class="card stat"><b>🔥${streak()}</b><small>Jours</small></div></div>
<h2>Ajouter une série</h2><div class="card"><select id="ex">${opts(last)}</select><div class="row" style="margin:8px 0"><input id="w" type="number" inputmode="decimal" placeholder="Kg"><input id="r" type="number" inputmode="numeric" placeholder="Reps"><select id="rest"><option value="60">1:00</option><option value="90" selected>1:30</option><option value="120">2:00</option><option value="180">3:00</option></select></div><button class="pri" style="width:100%" onclick="add()">+ Valider la série</button></div>
<h2>Aujourd'hui</h2>${td.length?Object.entries(Object.groupBy(td,s=>s.ex)).map(([ex,ss])=>`<div class="card"><b>${ex}</b>${ss.map(s=>`<div class="set"><span>${s.w} kg × ${s.r} ${s.pr?'<span class="pr">★ RECORD</span>':''}</span><button class="x" onclick="del(${s.i})">✕</button></div>`).join('')}</div>`).join(''):'<p class="mu">Aucune série. Au boulot 💪</p>'}`}
if(view=='goals'){A.innerHTML=`<h2>Nouvel objectif (1RM)</h2><div class="card"><select id="gex">${opts()}</select><div class="row" style="margin-top:8px"><input id="gv" type="number" placeholder="Objectif kg"><button class="pri" onclick="setGoal()">OK</button></div></div><h2>En cours</h2>`+(Object.entries(D.goals).map(([ex,g])=>{const b=best(ex),p=Math.min(100,b/g*100);return`<div class="card"><div class="row sp"><b>${ex}</b><span class="mu">${b.toFixed(1)} / ${g} kg</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="row sp" style="margin-top:6px"><span class="${p>=100?'pr':'mu'}">${p>=100?'✓ Atteint !':`Encore ${(g-b).toFixed(1)} kg`}</span><button class="x" onclick="delete D.goals['${ex}'];save();render()">✕</button></div></div>`}).join('')||'<p class="mu">Fixe ton premier objectif 🎯</p>')}
if(view=='prog'){A.innerHTML=`<h2>Exercice</h2><select id="pex" onchange="chart()">${opts(last)}</select><div class="card" style="margin-top:12px"><canvas id="c"></canvas></div><h2>Records</h2>`+EX.filter(best).map(ex=>`<div class="card row sp"><span>${ex}</span><b class="grad">${best(ex).toFixed(1)} kg</b></div>`).join('');chart()}}
function chart(){const ex=$('#pex').value,c=$('#c'),x=c.getContext('2d'),W=c.width=c.offsetWidth*2,H=c.height=360,by={};
D.log.filter(s=>s.ex==ex).forEach(s=>by[s.d]=Math.max(by[s.d]||0,e1rm(s.w,s.r)));const v=Object.values(by),g=D.goals[ex];
x.font='24px system-ui';x.fillStyle='#8a8aa0';if(v.length<2){x.fillText('Au moins 2 séances pour la courbe',20,H/2);return}
const all=g?[...v,g]:v,mn=Math.min(...all)*.95,mx=Math.max(...all)*1.05,P=30,X=i=>P+i*(W-2*P)/(v.length-1),Y=y=>H-P-(y-mn)/(mx-mn)*(H-2*P);
if(g){x.setLineDash([8,8]);x.strokeStyle='#3ddc97';x.beginPath();x.moveTo(P,Y(g));x.lineTo(W-P,Y(g));x.stroke();x.setLineDash([]);x.fillStyle='#3ddc97';x.fillText('Objectif '+g,P,Y(g)-8)}
const gr=x.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#ff4d6d');gr.addColorStop(1,'#ff9e3d');x.strokeStyle=gr;x.lineWidth=5;x.lineJoin='round';x.beginPath();v.forEach((y,i)=>x[i?'lineTo':'moveTo'](X(i),Y(y)));x.stroke();
const f=x.createLinearGradient(0,0,0,H);f.addColorStop(0,'#ff4d6d44');f.addColorStop(1,'#ff4d6d00');x.lineTo(X(v.length-1),H-P);x.lineTo(P,H-P);x.fillStyle=f;x.fill()}
render();
</script>
</body>
</html>
